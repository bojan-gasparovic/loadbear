[workspace]
members = ["crates/loadbear-core", "crates/loadbear-sensors-windows"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/bojan-gasparovic/loadbear"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
raw-cpuid = "11.6.0"
