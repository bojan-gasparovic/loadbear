<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LoadBear</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #16181d;
    --line: #23262d;
    --text: #e8eaed;
    --dim: #9aa0aa;
    --faint: #6b717b;
    --easy: #4ea87a;
    --braced: #c9973f;
    --strained: #cf5a4e;
  }
  * { box-sizing: border-box; }

  /* The window is a fixed size and does not resize, so the layout is a fixed
     grid rather than a scrolling column. Nothing here may scroll: every region
     that could outgrow its slot clips and says how much it left out, which is
     honest and keeps the panel readable at a glance rather than needing to be
     driven. */
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default;
  }
  #app {
    height: 100%; padding: 16px 18px 12px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 12px; overflow: hidden;
  }

  header { display: grid; grid-template-columns: 46px auto 1fr auto; align-items: center; gap: 13px; }
  #bear { width: 46px; height: 46px; opacity: .95; }
  .title { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  #tier { font-size: 23px; font-weight: 620; letter-spacing: -.01em; line-height: 1.1; }
  #tier.easy { color: var(--easy); }
  #tier.braced { color: var(--braced); }
  #tier.strained { color: var(--strained); }

  /* The sentence explaining the tier sits in the header beside it, because a
     colour and its explanation should never be far enough apart to read one
     without the other. */
  #why { font-size: 11.5px; color: var(--dim); line-height: 1.45;
         padding-left: 15px; border-left: 1px solid var(--line); align-self: stretch;
         display: flex; align-items: center; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; overflow: hidden; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 11px; overflow: hidden; min-height: 0; }

  #cpu { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  #brand { font-size: 12.5px; }
  #matched { font-size: 11px; color: var(--faint); margin-top: 2px; }

  .rows { display: grid; gap: 1px; background: var(--line);
          border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 62px 1fr; gap: 10px;
         background: var(--panel); padding: 6px 10px; align-items: baseline; }
  .k { color: var(--faint); font-size: 11px; }
  .v { font-variant-numeric: tabular-nums; font-size: 12px; }
  .v .sub { color: var(--dim); font-size: 10.5px; }

  .bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .bar .lab { font-size: 9.5px; color: var(--faint); text-transform: uppercase;
              letter-spacing: .07em; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .bar .track { height: 4px; background: #1e2127; border-radius: 2px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0%; background: var(--dim); transition: width .35s ease, background .35s ease; }
  .bar.hot .fill { background: var(--braced); }
  .bar.max .fill { background: var(--strained); }

  h2 { font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--faint);
       margin: 0 0 6px; font-weight: 600; }
  h2 .hint { font-weight: 400; text-transform: none; letter-spacing: 0; color: #4c525b; }

  .graph svg { width: 100%; height: 50px; display: block;
               background: var(--panel); border: 1px solid var(--line); border-radius: 7px 7px 0 0; }
  .graph .strip { display: flex; height: 4px; border: 1px solid var(--line);
                  border-top: 0; border-radius: 0 0 7px 7px; overflow: hidden; background: var(--panel); }
  .graph .strip i { flex: 1 1 0; }
  .graph .cap { display: flex; justify-content: space-between; font-size: 9.5px;
                color: #4c525b; margin-top: 4px; }

  #verdicts { overflow: hidden; }
  .verdict { border-left: 2px solid var(--strained); background: var(--panel);
             border-radius: 0 5px 5px 0; padding: 7px 10px; margin-bottom: 6px; }
  .verdict.degraded { border-left-color: var(--braced); }
  .verdict .vk { font-size: 11px; font-weight: 620; margin-bottom: 2px; }
  .verdict .vd { font-size: 11.5px; color: var(--text); }
  .verdict .vc { font-size: 11.5px; margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line); }
  .verdict .va { font-size: 10.5px; color: var(--dim); margin-top: 2px; }
  .verdict .vn { font-size: 10.5px; color: var(--faint); margin-top: 5px;
                 padding-top: 5px; border-top: 1px solid var(--line); font-style: italic; }
  .more { font-size: 10.5px; color: var(--faint); }

  .quiet { color: var(--faint); font-size: 11.5px; }

  .plist .p { display: grid; grid-template-columns: 1fr 46px 62px; gap: 7px;
              font-size: 11px; padding: 3px 0; align-items: baseline; }
  .plist .p .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .p .pv { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .plist .p.head { color: #4c525b; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; }
  .plist .p.head .pv { color: #4c525b; }
  /* A container is drawn as a child of the Docker row above it, because that
     is exactly what it is: the thing Windows could see, opened up. */
  .plist .p.container .pn { padding-left: 13px; color: var(--dim); position: relative; }
  .plist .p.container .pn::before { content: "\21B3"; position: absolute; left: 1px; color: #4c525b; }

  /* Temperature lives in the header rather than in a panel of its own. Per
     core tiles and nothing else: the package figure was the average of what
     these already say, so it cost a line and told nobody anything new. */
  #temp { justify-self: end; text-align: right; max-width: 250px; }
  #zones { display: none; grid-template-columns: repeat(4, 38px); gap: 3px; }
  #zones .z { background: #1b1e24; border-radius: 4px; padding: 2px 3px; text-align: center; }
  #zones .zl { font-size: 8px; color: #4c525b; letter-spacing: .03em; line-height: 1.2; }
  #zones .zv { font-size: 11px; font-variant-numeric: tabular-nums; line-height: 1.25; }
  #zones .z.hot .zv { color: var(--braced); }
  #zones .z.max .zv { color: var(--strained); }
  #temp-note { font-size: 10.5px; color: var(--faint); line-height: 1.4; }
  #enable { margin-top: 6px; display: none; font: inherit; font-size: 10.5px; font-weight: 560;
            color: #0e0f12; background: var(--text); border: 0; border-radius: 5px;
            padding: 4px 10px; cursor: pointer; }
  #enable:hover:not(:disabled) { background: #fff; }
  #enable:disabled { opacity: .5; cursor: default; }
  #enable-note { display: none; margin-top: 5px; font-size: 10px; color: var(--faint); }
  #enable-note.bad { color: var(--strained); }

  footer { font-size: 10px; color: #3f444c; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="app">
  <header>
    <img id="bear" src="bear-easy-128.png" alt="" />
    <div>
      <div class="title">LoadBear</div>
      <div id="tier" class="easy">Easy</div>
    </div>
    <div id="why">Starting up.</div>
    <div id="temp">
      <div id="zones"></div>
      <div id="temp-note"></div>
      <button id="enable">Enable temperature</button>
      <div id="enable-note"></div>
    </div>
  </header>

  <div class="cols">
    <div class="col">
      <div id="cpu">
        <div id="brand">Reading...</div>
        <div id="matched"></div>
      </div>

      <div class="rows">
        <div class="row"><div class="k">Clock</div><div class="v" id="clock">-</div></div>
        <div class="row"><div class="k">Load</div><div class="v" id="load">-</div></div>
        <div class="row"><div class="k">Queue</div><div class="v" id="queue">-</div></div>
        <div class="row"><div class="k">Memory</div><div class="v" id="memory">-</div></div>
        <div class="row"><div class="k">Disk</div><div class="v" id="disk">-</div></div>
      </div>

      <div class="bars">
        <div class="bar" id="bar-cpu"><div class="lab"><span>cpu</span><span class="pct">0%</span></div><div class="track"><div class="fill"></div></div></div>
        <div class="bar" id="bar-mem"><div class="lab"><span>memory</span><span class="pct">0%</span></div><div class="track"><div class="fill"></div></div></div>
        <div class="bar" id="bar-io"><div class="lab"><span>io</span><span class="pct">0%</span></div><div class="track"><div class="fill"></div></div></div>
      </div>

    </div>

    <div class="col">
      <div class="graph">
        <svg id="chart" viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="strip" id="strip"></div>
        <div class="cap">
          <span>5 min ago</span>
          <span><b style="color:#5b7fa3">&#9473;</b> load &nbsp; <b style="color:#cf5a4e">&#9473;</b> stall &nbsp; strip: tier</span>
          <span>now</span>
        </div>
      </div>

      <div>
        <h2>Findings</h2>
        <div id="verdicts"></div>
      </div>

      <div id="contributors-block" style="display:none">
        <h2>Heaviest <span class="hint" id="contrib-hint"></span></h2>
        <div class="plist" id="contributors"></div>
      </div>
    </div>
  </div>

  <footer><span id="stamp"></span><span>stall is measured, not utilization</span></footer>
</div>

<script>
const invoke = () => window.__TAURI__.core.invoke('get_status');
const $ = id => document.getElementById(id);

// Process and container names come from the filesystem and from Docker, so
// they are the one part of this status that LoadBear did not write itself.
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const mb = v => v >= 1024 ? (v / 1024).toFixed(1) + ' GB' : Math.round(v) + ' MB';

function bar(el, v) {
  const pct = Math.round(v * 100);
  el.querySelector('.fill').style.width = pct + '%';
  el.querySelector('.pct').textContent = pct + '%';
  el.classList.toggle('hot', v >= 0.40 && v < 0.80);
  el.classList.toggle('max', v >= 0.80);
}

const TIER_COLOR = ['#4ea87a', '#c9973f', '#cf5a4e'];

// Utilization as an area, the worst stall over it, and a strip underneath
// showing what the tier actually was at each tick.
//
// The point of the strip is the comparison. A spike in the line with no
// matching colour under it is LoadBear visibly declining to call a burst a
// problem, which has to be legible for the tier to be worth trusting.
function drawGraph(history) {
  const svg = $('chart'), strip = $('strip');
  if (!history || history.length < 2) {
    svg.innerHTML = '<text x="100" y="55" fill="#4c525b" font-size="9" text-anchor="middle">collecting</text>';
    strip.innerHTML = '';
    return;
  }

  const n = history.length;
  const x = i => (i / (n - 1)) * 200;
  const y = v => 100 - Math.max(0, Math.min(1, v)) * 96 - 2;
  const line = key => history.map((h, i) => `${x(i).toFixed(2)},${y(key(h)).toFixed(2)}`).join(' ');

  const util = line(h => h.utilization / 100);
  const stall = line(h => Math.max(h.cpu, h.memory, h.io));

  svg.innerHTML =
    `<polygon points="0,100 ${util} 200,100" fill="#2a3f52" opacity=".5" />` +
    `<polyline points="${util}" fill="none" stroke="#5b7fa3" stroke-width="1" vector-effect="non-scaling-stroke" />` +
    `<polyline points="${stall}" fill="none" stroke="#cf5a4e" stroke-width="1" stroke-opacity=".85" vector-effect="non-scaling-stroke" />`;

  strip.innerHTML = history.map(h =>
    `<i style="background:${TIER_COLOR[h.tier] || TIER_COLOR[0]}"></i>`).join('');
}

// Nothing scrolls, so anything that will not fit is dropped and counted rather
// than pushed out of sight.
const VERDICT_SLOTS = 2;
const CONTRIBUTOR_SLOTS = 6;

// Two rows of four. More cores than this and the rest are left off rather than
// allowed to push the header taller, because the header is a fixed slot.
const CORE_TILES = 8;

// Tiles for cores and nothing else. The package figure is an average of what
// the tiles already show, so it took a line to repeat them.
//
// LoadBear never invents a normal range, so a tile is never coloured against
// one. Colour comes from headroom below the vendor's own TjMax, and when TjMax
// is unknown the tiles stay uncoloured rather than guessing.
function drawTemperature(s) {
  const zones = (s.temp_zones || []).filter(([label]) => /^core/i.test(label));
  const z = $('zones'), note = $('temp-note'), en = $('enable');

  if (zones.length) {
    z.style.display = 'grid';
    note.textContent = '';
    z.innerHTML = zones.slice(0, CORE_TILES).map(([label, val]) => {
      const n = label.replace(/^core\s*/i, '');
      return `<div class="z"><div class="zl">${esc(n)}</div><div class="zv">${val.toFixed(0)}</div></div>`;
    }).join('');
  } else {
    z.style.display = 'none';
    // Per core readings are the point. Without them, say so briefly rather
    // than falling back to a single number pretending to be the same thing.
    note.textContent = s.temp_available
      ? 'No per core temperature from this processor.'
      : s.temp_reason;
  }

  en.style.display = s.temp_offerable ? 'inline-block' : 'none';
  if (!en.disabled) en.textContent = s.temp_available ? 'Update helper' : 'Enable temperature';
}

function render(s) {
  const tier = s.tier.toLowerCase();
  $('tier').textContent = s.tier;
  $('tier').className = tier;
  $('bear').src = 'bear-' + tier + '-128.png';
  $('why').textContent = s.reason;

  $('brand').textContent = s.brand || 'Unknown processor';
  $('matched').textContent = s.matched
    ? `${s.matched} (${s.cores}C/${s.threads}T, base ${s.base_mhz} MHz, ${s.tdp_watts} W)`
    : 'not in the specification database, so published limits are unavailable';

  $('clock').innerHTML = s.mhz
    ? `${s.mhz} MHz <span class="sub">sustained${s.base_mhz ? ', base ' + s.base_mhz : ''}</span>`
    : 'unavailable';
  $('load').innerHTML = `${s.utilization.toFixed(0)}% <span class="sub">utilization</span>`;
  $('queue').innerHTML = `${s.queue.toFixed(1)} <span class="sub">waiting, ${s.logical} processors</span>`;
  $('memory').innerHTML = `${Math.round(s.available_mb)} MB <span class="sub">free, ${Math.round(s.hard_faults)} hard faults/s</span>`;
  $('disk').innerHTML = `${s.disk_ms.toFixed(2)} ms <span class="sub">per transfer, queue ${s.disk_queue.toFixed(1)}</span>`;

  bar($('bar-cpu'), s.stall_cpu);
  bar($('bar-mem'), s.stall_memory);
  bar($('bar-io'), s.stall_io);

  drawGraph(s.history);

  const v = $('verdicts');
  if (!s.verdicts.length) {
    v.innerHTML = '<div class="quiet">No published limit has been crossed.</div>';
  } else {
    const shown = s.verdicts.slice(0, VERDICT_SLOTS);
    const hidden = s.verdicts.length - shown.length;
    v.innerHTML = shown.map(x => `
      <div class="verdict ${x.severity === 'Degraded' ? 'degraded' : ''}">
        <div class="vk">${x.kind}</div>
        <div class="vd">${x.detail}</div>
        ${x.cause
          ? `<div class="vc">Caused by <b>${esc(x.cause)}</b></div>
             ${x.action ? `<div class="va">${esc(x.action)}</div>` : ''}`
          : `<div class="vn">No single cause is clear enough to name.</div>`}
      </div>`).join('')
      + (hidden > 0 ? `<div class="more">and ${hidden} more</div>` : '');
  }

  // Only present when a resource is actually under pressure. A standing table
  // of what is running, reordering itself every tick, is Task Manager.
  const cblock = $('contributors-block');
  if (!s.contributors.length) {
    cblock.style.display = 'none';
  } else {
    cblock.style.display = 'block';
    $('contrib-hint').textContent = 'on the resource above';
    $('contributors').innerHTML =
      '<div class="p head"><div class="pn">name</div><div class="pv">cpu</div><div class="pv">memory</div></div>'
      + s.contributors.slice(0, CONTRIBUTOR_SLOTS).map(c => `
        <div class="p${c.is_container ? ' container' : ''}">
          <div class="pn">${esc(c.name)}</div>
          <div class="pv">${c.cpu.toFixed(1)}%</div>
          <div class="pv">${mb(c.memory_mb)}${c.limit_mb ? ' / ' + mb(c.limit_mb) : ''}</div>
        </div>`).join('');
  }

  drawTemperature(s);

  $('stamp').textContent = new Date().toLocaleTimeString();
}

$('enable').addEventListener('click', async () => {
  const b = $('enable'), n = $('enable-note');
  b.disabled = true; b.textContent = 'Installing...';
  n.style.display = 'block'; n.className = '';
  n.textContent = 'Checking the installer signature. Windows will ask for permission.';
  try {
    n.textContent = await window.__TAURI__.core.invoke('enable_temperature');
    b.style.display = 'none';
  } catch (e) {
    n.className = 'bad';
    n.textContent = String(e);
    b.disabled = false; b.textContent = 'Try again';
  }
});

async function tick() {
  try { render(await invoke()); } catch (e) { console.error(e); }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
