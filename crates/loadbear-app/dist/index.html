<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LoadBear</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #16181d;
    --line: #23262d;
    --text: #e8eaed;
    --dim: #9aa0aa;
    --faint: #6b717b;
    --easy: #4ea87a;
    --braced: #c9973f;
    --strained: #cf5a4e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default;
  }
  #app { height: 100%; padding: 20px 22px 22px; display: flex; flex-direction: column; }

  header { flex: none; display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  #bear { width: 52px; height: 52px; flex: none; opacity: .95; }
  .title { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  #tier { font-size: 26px; font-weight: 620; letter-spacing: -.01em; line-height: 1.1; }
  #tier.easy { color: var(--easy); }
  #tier.braced { color: var(--braced); }
  #tier.strained { color: var(--strained); }

  #cpu { flex: none; margin: 14px 0 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  #brand { font-size: 13px; }
  #matched { font-size: 12px; color: var(--faint); margin-top: 3px; }

  .rows { flex: none; display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 88px 1fr; gap: 12px; background: var(--panel); padding: 9px 12px; align-items: baseline; }
  .k { color: var(--faint); font-size: 12px; }
  .v { font-variant-numeric: tabular-nums; font-size: 13px; }
  .v .sub { color: var(--dim); font-size: 12px; }

  .bars { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .bar .lab { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .bar .track { height: 5px; background: #1e2127; border-radius: 3px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0%; background: var(--dim); transition: width .35s ease, background .35s ease; }
  .bar.hot .fill { background: var(--braced); }
  .bar.max .fill { background: var(--strained); }

  h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint);
       margin: 20px 0 9px; font-weight: 600; flex: none; }
  #verdicts { flex: 1 1 auto; min-height: 64px; overflow-y: auto; overflow-x: hidden; }
  #verdicts::-webkit-scrollbar { width: 8px; }
  #verdicts::-webkit-scrollbar-thumb { background: #2c3038; border-radius: 4px; }
  #verdicts::-webkit-scrollbar-track { background: transparent; }

  .verdict { border-left: 2px solid var(--strained); background: var(--panel);
             border-radius: 0 6px 6px 0; padding: 10px 13px; margin-bottom: 9px; }
  .verdict.degraded { border-left-color: var(--braced); }
  .verdict .vk { font-size: 12px; font-weight: 620; margin-bottom: 4px; }
  .verdict .vd { font-size: 12.5px; color: var(--text); }
  .verdict .vb { font-size: 11.5px; color: var(--faint); margin-top: 6px; line-height: 1.45; }
  .verdict .vc { font-size: 12.5px; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line); }
  .verdict .vc b { font-weight: 620; }
  .verdict .va { font-size: 11.5px; color: var(--dim); margin-top: 3px; }
  .verdict .vn { font-size: 11.5px; color: var(--faint); margin-top: 7px; padding-top: 7px;
                 border-top: 1px solid var(--line); font-style: italic; }

  .quiet { color: var(--faint); font-size: 12.5px; padding: 12px 0; }

  h2 .hint { font-weight: 400; color: var(--faint); text-transform: none; letter-spacing: 0; }
  .plist { flex: none; }
  .plist .p { display: grid; grid-template-columns: 1fr 58px 74px; gap: 8px; font-size: 11.5px;
              padding: 4px 0; align-items: baseline; }
  .plist .p .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .p .pv { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .plist .p.head { color: var(--faint); font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; }
  .plist .p.head .pv { color: var(--faint); }

  .temp { margin-top: 16px; flex: none; padding: 11px 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .temp .t1 { font-size: 12.5px; }
  .temp .t2 { font-size: 11.5px; color: var(--faint); margin-top: 4px; line-height: 1.5; }
  .temp a { color: var(--dim); }
  #enable { margin-top: 10px; display: none; font: inherit; font-size: 12px; font-weight: 560;
            color: #0e0f12; background: var(--text); border: 0; border-radius: 6px;
            padding: 7px 13px; cursor: pointer; }
  #enable:hover:not(:disabled) { background: #fff; }
  #enable:disabled { opacity: .5; cursor: default; }
  #enable-note { display: none; margin-top: 8px; font-size: 11.5px; color: var(--faint); }
  #enable-note.bad { color: var(--strained); }
  #zones { display: none; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 9px; }
  #zones .z { background: #1b1e24; border-radius: 5px; padding: 5px 6px; text-align: center; }
  #zones .zl { font-size: 9.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
  #zones .zv { font-size: 12.5px; font-variant-numeric: tabular-nums; margin-top: 1px; }

  footer { margin-top: 16px; flex: none; font-size: 11px; color: #4c525b; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="app">
  <header>
    <img id="bear" src="bear-easy-128.png" alt="" />
    <div>
      <div class="title">LoadBear</div>
      <div id="tier" class="easy">Easy</div>
    </div>
  </header>

  <div id="cpu">
    <div id="brand">Reading...</div>
    <div id="matched"></div>
  </div>

  <div class="rows">
    <div class="row"><div class="k">Clock</div><div class="v" id="clock">-</div></div>
    <div class="row"><div class="k">Load</div><div class="v" id="load">-</div></div>
    <div class="row"><div class="k">Queue</div><div class="v" id="queue">-</div></div>
    <div class="row"><div class="k">Memory</div><div class="v" id="memory">-</div></div>
    <div class="row"><div class="k">Disk</div><div class="v" id="disk">-</div></div>
  </div>

  <div class="bars">
    <div class="bar" id="bar-cpu"><div class="lab"><span>cpu</span><span class="pct">0%</span></div><div class="track"><div class="fill"></div></div></div>
    <div class="bar" id="bar-mem"><div class="lab"><span>memory</span><span class="pct">0%</span></div><div class="track"><div class="fill"></div></div></div>
    <div class="bar" id="bar-io"><div class="lab"><span>io</span><span class="pct">0%</span></div><div class="track"><div class="fill"></div></div></div>
  </div>

  <h2>Findings</h2>
  <div id="verdicts"><div class="quiet">Nothing to report.</div></div>

  <h2>Running <span class="hint" id="running-hint"></span></h2>
  <div class="plist" id="top"></div>

  <div id="containers-block" style="display:none">
    <h2>Containers</h2>
    <div class="plist" id="containers"></div>
  </div>

  <div class="temp">
    <div class="t1" id="temp1">Temperature</div>
    <div class="t2" id="temp2"></div>
    <div id="zones"></div>
    <button id="enable">Enable temperature</button>
    <div id="enable-note"></div>
  </div>

  <footer><span id="stamp"></span><span>stall is measured, not utilization</span></footer>
</div>

<script>
const invoke = () => window.__TAURI__.core.invoke('get_status');
const $ = id => document.getElementById(id);

// Process and container names come from the filesystem and from Docker, so
// they are the one part of this status that LoadBear did not write itself.
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function bar(el, v) {
  const pct = Math.round(v * 100);
  el.querySelector('.fill').style.width = pct + '%';
  el.querySelector('.pct').textContent = pct + '%';
  el.classList.toggle('hot', v >= 0.40 && v < 0.80);
  el.classList.toggle('max', v >= 0.80);
}

function render(s) {
  const tier = s.tier.toLowerCase();
  $('tier').textContent = s.tier;
  $('tier').className = tier;
  $('bear').src = 'bear-' + tier + '-128.png';

  $('brand').textContent = s.brand || 'Unknown processor';
  $('matched').textContent = s.matched
    ? `matched to ${s.matched} (${s.cores}C/${s.threads}T, base ${s.base_mhz} MHz, ${s.tdp_watts} W)`
    : 'not in the specification database, so published limits are unavailable';

  $('clock').innerHTML = s.mhz
    ? `${s.mhz} MHz <span class="sub">sustained${s.base_mhz ? ', base ' + s.base_mhz + ' MHz guaranteed' : ''}</span>`
    : 'unavailable';
  $('load').innerHTML = `${s.utilization.toFixed(0)}% <span class="sub">utilization, averaged. Shown because the clock guarantee only applies under load</span>`;
  $('queue').innerHTML = `${s.queue.toFixed(1)} <span class="sub">threads waiting across ${s.logical} logical processors</span>`;
  $('memory').innerHTML = `${Math.round(s.available_mb)} MB <span class="sub">available, ${Math.round(s.hard_faults)} hard faults/sec</span>`;
  $('disk').innerHTML = `${(s.disk_ms).toFixed(2)} ms <span class="sub">per transfer, queue ${s.disk_queue.toFixed(1)}</span>`;

  bar($('bar-cpu'), s.stall_cpu);
  bar($('bar-mem'), s.stall_memory);
  bar($('bar-io'), s.stall_io);

  const v = $('verdicts');
  if (!s.verdicts.length) {
    v.innerHTML = '<div class="quiet">Nothing to report.</div>';
  } else {
    v.innerHTML = s.verdicts.map(x => `
      <div class="verdict ${x.severity === 'Degraded' ? 'degraded' : ''}">
        <div class="vk">${x.kind}</div>
        <div class="vd">${x.detail}</div>
        <div class="vb">${x.basis}</div>
        ${x.cause
          ? `<div class="vc">Caused by <b>${esc(x.cause)}</b></div>
             ${x.action ? `<div class="va">${esc(x.action)}</div>` : ''}`
          : `<div class="vn">No single cause is clear enough to name.</div>`}
      </div>`).join('');
  }

  const top = $('top');
  if (!s.top.length) {
    top.innerHTML = '<div class="quiet">Reading processes...</div>';
    $('running-hint').textContent = '';
  } else {
    // Listed for comparison against the findings above. Something appearing
    // here has not been blamed for anything; a cause is only named when the
    // evidence clears the bar.
    $('running-hint').textContent = `heaviest of ${s.logical} logical processors`;
    top.innerHTML = '<div class="p head"><div class="pn">process</div><div class="pv">cpu</div><div class="pv">memory</div></div>'
      + s.top.map(([name, cpu, mb]) => `
        <div class="p">
          <div class="pn">${esc(name)}</div>
          <div class="pv">${cpu.toFixed(1)}%</div>
          <div class="pv">${mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB'}</div>
        </div>`).join('');
  }

  const cb = $('containers-block');
  if (s.docker_present) {
    cb.style.display = 'block';
    $('containers').innerHTML = '<div class="p head"><div class="pn">container</div><div class="pv">cpu</div><div class="pv">memory</div></div>'
      + s.containers.map(c => `
        <div class="p">
          <div class="pn">${esc(c.name)}</div>
          <div class="pv">${c.cpu.toFixed(1)}%</div>
          <div class="pv">${(c.memory_mb / 1024).toFixed(1)} GB${c.limit_mb ? ' / ' + (c.limit_mb / 1024).toFixed(1) : ''}</div>
        </div>`).join('');
  } else {
    cb.style.display = 'none';
  }

  $('temp1').textContent = s.temp_available ? s.temp_summary : 'Temperature unavailable';
  $('temp2').textContent = s.temp_available ? '' : s.temp_reason;
  const en = $('enable');
  en.style.display = s.temp_offerable ? 'inline-block' : 'none';
  if (!en.disabled) en.textContent = s.temp_available ? 'Update helper' : 'Enable temperature';

  const z = $('zones');
  if (s.temp_zones && s.temp_zones.length) {
    z.style.display = 'grid';
    z.innerHTML = s.temp_zones.map(([label, v]) =>
      `<div class="z"><div class="zl">${label}</div><div class="zv">${v.toFixed(1)}</div></div>`
    ).join('');
  } else {
    z.style.display = 'none';
  }

  $('stamp').textContent = new Date().toLocaleTimeString();
}

$('enable').addEventListener('click', async () => {
  const b = $('enable'), n = $('enable-note');
  b.disabled = true; b.textContent = 'Installing...';
  n.style.display = 'block'; n.className = '';
  n.textContent = 'Checking the bundled installer signature. Windows will ask for permission. A restart is needed afterwards.';
  try {
    n.textContent = await window.__TAURI__.core.invoke('enable_temperature');
    b.style.display = 'none';
  } catch (e) {
    n.className = 'bad';
    n.textContent = String(e);
    b.disabled = false; b.textContent = 'Try again';
  }
});

async function tick() {
  try { render(await invoke()); } catch (e) { console.error(e); }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
