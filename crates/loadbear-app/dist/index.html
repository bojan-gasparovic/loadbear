<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LoadBear</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #e3e6eb;
    --text: #16191e;
    --dim: #565d68;
    --faint: #848b96;
    --hair: #a8aeb8;
    --well: #eaedf1;

    /* Darkened from their dark mode values. The same green on white does not
       carry the same weight it did on near black, and these three are the only
       thing telling the user how the machine is doing. */
    --easy: #2e7d55;
    --braced: #96680f;
    --strained: #b13b2f;

    /* The graph, kept apart from the tier colours so a busy but healthy
       machine does not read as a warning. */
    --plot-fill: #dbe6f2;
    --plot-line: #4a7ba7;
  }
  * { box-sizing: border-box; }

  /* The window is a fixed size and does not resize, so the layout is a fixed
     grid rather than a scrolling column. Nothing here may scroll: every region
     that could outgrow its slot clips and says how much it left out, which is
     honest and keeps the panel readable at a glance rather than needing to be
     driven. */
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default;
  }
  #app {
    height: 100%; padding: 16px 18px 12px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 12px; overflow: hidden;
  }

  /* Two halves matching `.cols` below, so the temperature row is exactly as
     wide as the graph underneath it and the tiles line up with its edges. */
  header { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: center; }
  .hleft { display: grid; grid-template-columns: 46px auto; align-items: center;
           gap: 13px; justify-content: start; }
  /* The artwork is a flat white silhouette with only its alpha carrying
     shape, so it is invisible on a light background as an image. Painted
     through a mask it takes the tier colour, which loses nothing and puts the
     state in the one element the eye lands on first. */
  #bear { width: 46px; height: 46px; background-color: var(--faint);
          -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat;
          -webkit-mask-position: center; transition: background-color .3s ease; }
  .title { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  #tier { font-size: 23px; font-weight: 620; letter-spacing: -.01em; line-height: 1.1; }
  #tier.easy { color: var(--easy); }
  #tier.braced { color: var(--braced); }
  #tier.strained { color: var(--strained); }


  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; overflow: hidden; min-height: 0; }
  /* Explicit rows rather than flow, so a section that is empty still holds its
     slot and nothing below it moves when it fills. */
  .col-left { display: grid; grid-template-rows: auto auto 1fr; gap: 10px;
              overflow: hidden; min-height: 0; }
  .col-right { display: grid; grid-template-rows: 132px 1fr; gap: 10px;
               overflow: hidden; min-height: 0; }
  .col-left > *, .col-right > * { min-height: 0; overflow: hidden; }

  /* Things that belong together share a box. The border is the grouping. */
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: 9px 11px; display: flex;
           flex-direction: column; min-height: 0; overflow: hidden; }
  .panel > h2 { flex: none; }
  .panel .body { flex: 1 1 auto; min-height: 0; overflow: hidden; }

  #cpu { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  #brand { font-size: 12.5px; }
  #matched { font-size: 11px; color: var(--faint); margin-top: 2px; }

  .rows { display: grid; gap: 0; }
  .row { display: grid; grid-template-columns: 62px 1fr; gap: 10px;
         padding: 3px 0; align-items: baseline; }
  .k { color: var(--faint); font-size: 11px; }
  .v { font-variant-numeric: tabular-nums; font-size: 12px; }
  .v .sub { color: var(--dim); font-size: 10.5px; }

  /* Each stall carries the quantity it was actually measured from, because the
     percentage is a normalisation against a constant and the raw figure is the
     measurement. Where the constant is a poor fit for the hardware, and for
     disk latency it always is, the raw figure is the part worth reading. */
  .stalls { display: grid; gap: 7px; }
  .st { display: grid; grid-template-columns: 58px 1fr 30px; gap: 8px; align-items: center; }
  .st .sl { font-size: 10.5px; color: var(--faint); }
  .st .track { height: 5px; background: var(--well); border-radius: 3px; overflow: hidden; }
  .st .fill { height: 100%; width: 0%; background: var(--hair);
              transition: width .35s ease, background .35s ease; }
  .st.hot .fill { background: var(--braced); }
  .st.max .fill { background: var(--strained); }
  .st .sv { font-size: 10.5px; text-align: right; color: var(--dim);
            font-variant-numeric: tabular-nums; }
  .st .sr { grid-column: 2 / 4; font-size: 10px; color: var(--hair);
            font-variant-numeric: tabular-nums; margin-top: -4px; }

  h2 { font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--faint);
       margin: 0 0 6px; font-weight: 600; }
  h2 .hint { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--hair); }

  .graph { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .graph svg { width: 100%; flex: 1 1 auto; min-height: 40px; display: block; }
  .graph .strip { display: flex; height: 4px; overflow: hidden; flex: none;
                  border-radius: 2px; margin-top: 3px; }
  .graph .strip i { flex: 1 1 0; }
  .graph .cap { display: flex; justify-content: space-between; align-items: baseline;
                font-size: 10px; color: var(--hair); margin-top: 5px; }
  /* The legend colours the word rather than a swatch beside it. A single dash
     glyph at this size reads as grey whatever colour it is actually painted. */
  .graph .cap i { font-style: normal; font-weight: 650; margin-left: 11px; }
  .graph .cap i:first-child { margin-left: 0; }
  .graph .cap .k-busy { color: var(--plot-line); }
  .graph .cap .k-wait { color: var(--strained); }

  #verdicts { overflow: hidden; }
  #why { font-size: 11.5px; color: var(--dim); line-height: 1.4; }
  .verdict { border-left: 2px solid var(--strained); background: var(--well);
             border-radius: 0 5px 5px 0; padding: 6px 9px; margin-top: 6px; }
  .verdict.degraded { border-left-color: var(--braced); }
  .verdict .vk { font-size: 11px; font-weight: 620; margin-bottom: 2px; }
  .verdict .vd { font-size: 11.5px; color: var(--text); }
  .verdict .vc { font-size: 11.5px; margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line); }
  .verdict .va { font-size: 10.5px; color: var(--dim); margin-top: 2px; }
  .verdict .vn { font-size: 10.5px; color: var(--faint); margin-top: 5px;
                 padding-top: 5px; border-top: 1px solid var(--line); font-style: italic; }
  .more { font-size: 10.5px; color: var(--faint); }

  .quiet { color: var(--faint); font-size: 11.5px; }

  .plist { height: 100%; overflow: hidden; }
  .plist .p { display: grid; grid-template-columns: 1fr 44px 60px; gap: 7px;
              font-size: 11px; padding: 2px 0; align-items: baseline; }
  .plist .p .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .p .pv { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .plist .p.head { color: var(--hair); font-size: 9px; text-transform: uppercase; letter-spacing: .05em; }
  .plist .p.head .pv { color: var(--hair); }
  /* A container is drawn as a child of the Docker row above it, because that
     is exactly what it is: the thing Windows could see, opened up. */
  .plist .p.container .pn { padding-left: 13px; color: var(--dim); position: relative; }
  .plist .p.container .pn::before { content: "\21B3"; position: absolute; left: 1px; color: var(--hair); }

  /* Temperature lives in the header rather than in a panel of its own. Per
     core tiles and nothing else, in a single row: the package figure was the
     average of what these already say, so it cost a line to repeat them. */
  #temp { text-align: right; min-height: 34px; display: flex;
          flex-direction: column; justify-content: center; }
  /* Eight equal fractions of the half, so the row is the width of the graph
     below it whatever the window is. */
  #zones { display: none; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  #zones .z { background: var(--well); border: 1px solid transparent;
              border-radius: 5px; padding: 3px 2px; text-align: center; }
  #zones .zl { font-size: 8.5px; color: var(--faint); letter-spacing: .04em; line-height: 1.2; }
  #zones .zv { font-size: 14px; font-weight: 560; font-variant-numeric: tabular-nums; line-height: 1.2; }

  /* Coloured by headroom below the vendor's published TjMax, never by an
     absolute scale. A band is chosen in `loadbear_core::thermal_band`, and a
     part that publishes no limit gets no colour rather than a guess. */
  #zones .z.normal  { background: #e4f1ea; border-color: #c6e2d3; }
  #zones .z.normal  .zv { color: var(--easy); }
  #zones .z.warm    { background: #fbf2d8; border-color: #ecdca6; }
  #zones .z.warm    .zv { color: #8a6c08; }
  #zones .z.hot     { background: #fdeadb; border-color: #f3cfb2; }
  #zones .z.hot     .zv { color: #b3560f; }
  #zones .z.atlimit { background: #fbe3e0; border-color: #efc4bf; }
  #zones .z.atlimit .zv { color: var(--strained); }
  #temp-note { font-size: 10.5px; color: var(--faint); line-height: 1.4; }
  #enable { margin-top: 6px; display: none; font: inherit; font-size: 10.5px; font-weight: 560;
            color: #ffffff; background: var(--text); border: 0; border-radius: 5px;
            padding: 4px 10px; cursor: pointer; }
  #enable:hover:not(:disabled) { background: #3a424e; }
  #enable:disabled { opacity: .5; cursor: default; }
  #enable-note { display: none; margin-top: 5px; font-size: 10px; color: var(--faint); }
  #enable-note.bad { color: var(--strained); }

  footer { font-size: 10px; color: var(--hair); display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hleft">
      <div id="bear" role="img" aria-label="LoadBear"></div>
      <div>
        <div class="title">LoadBear</div>
        <div id="tier" class="easy">Easy</div>
      </div>
    </div>
    <div id="temp">
      <div id="zones"></div>
      <div id="temp-note"></div>
      <button id="enable">Enable temperature</button>
      <div id="enable-note"></div>
    </div>
  </header>

  <div class="cols">
    <div class="col-left">
      <div class="panel">
        <h2>Processor</h2>
        <div class="body">
          <div id="brand">Reading...</div>
          <div id="matched"></div>
          <div class="rows">
            <div class="row"><div class="k">Clock</div><div class="v" id="clock">-</div></div>
            <div class="row"><div class="k">Busy</div><div class="v" id="load">-</div></div>
            <div class="row"><div class="k">Memory</div><div class="v" id="memory">-</div></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Bottlenecks</h2>
        <div class="body">
          <div class="stalls">
            <div class="st" id="st-cpu">
              <div class="sl">processor</div>
              <div class="track"><div class="fill"></div></div>
              <div class="sv">0%</div>
              <div class="sr"></div>
            </div>
            <div class="st" id="st-mem">
              <div class="sl">memory</div>
              <div class="track"><div class="fill"></div></div>
              <div class="sv">0%</div>
              <div class="sr"></div>
            </div>
            <div class="st" id="st-disk">
              <div class="sl">disk</div>
              <div class="track"><div class="fill"></div></div>
              <div class="sv">0%</div>
              <div class="sr"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Last 5 minutes</h2>
        <div class="body graph">
          <svg id="chart" viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="strip" id="strip"></div>
          <div class="cap">
            <span>5 min ago</span>
            <span><i class="k-busy">busy</i><i class="k-wait">stall</i></span>
            <span>now</span>
          </div>
        </div>
      </div>
    </div>

    <div class="col-right">
      <div class="panel">
        <h2>Findings</h2>
        <div class="body">
          <div id="why"></div>
          <div id="verdicts"></div>
        </div>
      </div>

      <div class="panel">
        <h2 id="running-head">Running</h2>
        <div class="body">
          <div class="plist" id="running"></div>
        </div>
      </div>
    </div>
  </div>

  <footer><span id="stamp"></span></footer>
</div>

<script>
const invoke = () => window.__TAURI__.core.invoke('get_status');
const $ = id => document.getElementById(id);

// Process and container names come from the filesystem and from Docker, so
// they are the one part of this status that LoadBear did not write itself.
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const mb = v => v >= 1024 ? (v / 1024).toFixed(1) + ' GB' : Math.round(v) + ' MB';

// One stall row: the normalised bar, and the quantity it was measured from.
//
// The percentage is a normalisation against a saturation constant, and two of
// the three constants are admittedly weak. The raw figure beside it is the
// actual measurement, so a bar sitting near zero can be read as "the disk is
// answering in half a millisecond" rather than as a broken indicator.
function stall(el, v, raw) {
  const pct = Math.round(v * 100);
  el.querySelector('.fill').style.width = Math.max(pct, v > 0 ? 1 : 0) + '%';
  el.querySelector('.sv').textContent = pct + '%';
  el.querySelector('.sr').textContent = raw;
  el.classList.toggle('hot', v >= 0.40 && v < 0.80);
  el.classList.toggle('max', v >= 0.80);
}

// Read from the stylesheet rather than repeated here, so the strip, the bear
// and the tier word can never disagree about what Braced looks like.
const css = getComputedStyle(document.documentElement);
const ink = name => css.getPropertyValue(name).trim();
const TIER_COLOR = [ink('--easy'), ink('--braced'), ink('--strained')];
const TIER_INDEX = { easy: 0, braced: 1, strained: 2 };

// Utilization as an area, the worst stall over it, and a strip underneath
// showing what the tier actually was at each tick.
//
// The point of the strip is the comparison. A spike in the line with no
// matching colour under it is LoadBear visibly declining to call a burst a
// problem, which has to be legible for the tier to be worth trusting.
function drawGraph(history) {
  const svg = $('chart'), strip = $('strip');
  if (!history || history.length < 2) {
    svg.innerHTML = `<text x="100" y="55" fill="${ink('--hair')}" font-size="9" text-anchor="middle">collecting</text>`;
    strip.innerHTML = '';
    return;
  }

  const n = history.length;
  const x = i => (i / (n - 1)) * 200;
  const y = v => 100 - Math.max(0, Math.min(1, v)) * 96 - 2;
  const line = key => history.map((h, i) => `${x(i).toFixed(2)},${y(key(h)).toFixed(2)}`).join(' ');

  const util = line(h => h.utilization / 100);
  const stall = line(h => Math.max(h.cpu, h.memory, h.io));

  svg.innerHTML =
    `<polygon points="0,100 ${util} 200,100" fill="${ink('--plot-fill')}" />` +
    `<polyline points="${util}" fill="none" stroke="${ink('--plot-line')}" stroke-width="1.5" vector-effect="non-scaling-stroke" />` +
    `<polyline points="${stall}" fill="none" stroke="${ink('--strained')}" stroke-width="1.5" vector-effect="non-scaling-stroke" />`;

  strip.innerHTML = history.map(h =>
    `<i style="background:${TIER_COLOR[h.tier] || TIER_COLOR[0]}"></i>`).join('');
}

// Nothing scrolls, so anything that will not fit is dropped and counted rather
// than pushed out of sight.
const VERDICT_SLOTS = 2;

// One row. More cores than this and the rest are left off rather than allowed
// to wrap and push the header taller, because the header is a fixed slot.
const CORE_TILES = 8;

// The contributor list is headed with the thing it is ranked by, rather than
// pointing vaguely at the panel above it.
// The list reorders itself to answer whichever question the rest of the window
// is asking, so it says which order it is in.
const RUNNING_HEAD = {
  cpu: 'Running · by processor',
  memory: 'Running · by memory',
  disk: 'Running · by memory',
};

// Tiles for cores and nothing else. The package figure is an average of what
// the tiles already show, so it took a line to repeat them.
//
// LoadBear never invents a normal range, so a tile is never coloured against
// one. Colour comes from headroom below the vendor's own TjMax, and when TjMax
// is unknown the tiles stay uncoloured rather than guessing.
function drawTemperature(s) {
  const zones = (s.temp_zones || []).filter(z => /^core/i.test(z.label));
  const z = $('zones'), note = $('temp-note'), en = $('enable');

  if (zones.length) {
    z.style.display = 'grid';
    note.textContent = '';
    z.innerHTML = zones.slice(0, CORE_TILES).map(zone => {
      const n = zone.label.replace(/^core\s*/i, '');
      // The band is decided in the engine against the published TjMax. An
      // absent band means the part publishes no limit, and the tile stays
      // uncoloured rather than being coloured against an invented range.
      return `<div class="z ${zone.band || ''}">`
        + `<div class="zl">${esc(n)}</div>`
        + `<div class="zv">${zone.celsius.toFixed(0)}</div></div>`;
    }).join('');
  } else {
    z.style.display = 'none';
    // Per core readings are the point. Without them, say so briefly rather
    // than falling back to a single number pretending to be the same thing.
    note.textContent = s.temp_available
      ? 'No per core sensor.'
      : s.temp_reason;
  }

  en.style.display = s.temp_offerable ? 'inline-block' : 'none';
  if (!en.disabled) en.textContent = s.temp_available ? 'Update helper' : 'Enable temperature';
}

function clockText(s) {
  if (!s.mhz) return 'unavailable';
  if (!s.base_mhz) return `${s.mhz} MHz`;
  const d = s.mhz - s.base_mhz;
  if (d >= 0) {
    return `${s.mhz} MHz <span class="sub">${d} above the ${s.base_mhz} promised</span>`;
  }
  return `${s.mhz} MHz <span class="sub">${-d} below the ${s.base_mhz} promised</span>`;
}

function render(s) {
  const tier = s.tier.toLowerCase();
  $('tier').textContent = s.tier;
  $('tier').className = tier;
  const bear = $('bear');
  bear.style.webkitMaskImage = `url('bear-${tier}-128.png')`;
  bear.style.backgroundColor = TIER_COLOR[TIER_INDEX[tier] ?? 0];
  $('why').textContent = s.reason;

  $('brand').textContent = s.brand || 'Unknown processor';
  $('matched').textContent = s.matched
    ? `${s.matched} (${s.cores}C/${s.threads}T, base ${s.base_mhz} MHz, ${s.tdp_watts} W)`
    : 'not in the specification database, so published limits are unavailable';

  // "3227 MHz sustained, base 2000" left the reader to work out which way is
  // good. The thing worth knowing is whether the processor is keeping the
  // manufacturer's promise, so say that instead of printing both numbers.
  $('clock').innerHTML = clockText(s);
  $('load').innerHTML = `${s.utilization.toFixed(0)}% <span class="sub">of ${s.logical} processors</span>`;
  $('memory').innerHTML = s.total_mb > 0
    ? `${mb(s.available_mb)} free <span class="sub">of ${mb(s.total_mb)}</span>`
    : `${mb(s.available_mb)} free`;

  stall($('st-cpu'), s.stall_cpu, `${s.queue.toFixed(1)} queued`);
  stall($('st-mem'), s.stall_memory, `${Math.round(s.hard_faults)} fetches/sec`);
  stall($('st-disk'), s.stall_io, `${s.disk_ms.toFixed(2)} ms`);

  // Busy and waiting are different things, and the whole product rests on the
  // difference. Saying so once beats letting three flat bars read as broken.

  drawGraph(s.history);

  const v = $('verdicts');
  if (!s.verdicts.length) {
    v.innerHTML = '';
  } else {
    const shown = s.verdicts.slice(0, VERDICT_SLOTS);
    const hidden = s.verdicts.length - shown.length;
    v.innerHTML = shown.map(x => `
      <div class="verdict ${x.severity === 'Degraded' ? 'degraded' : ''}">
        <div class="vk">${x.kind}</div>
        <div class="vd">${x.detail}</div>
        ${x.cause
          ? `<div class="vc">Caused by <b>${esc(x.cause)}</b></div>
             ${x.action ? `<div class="va">${esc(x.action)}</div>` : ''}`
          : `<div class="vn">No clear cause.</div>`}
      </div>`).join('')
      + (hidden > 0 ? `<div class="more">and ${hidden} more</div>` : '');
  }

  $('running-head').textContent = RUNNING_HEAD[s.driver] || 'Running';
  $('running').innerHTML =
    '<div class="p head"><div class="pn">application</div><div class="pv">cpu</div><div class="pv">memory</div></div>'
    + s.running.map(c => `
      <div class="p${c.is_container ? ' container' : ''}">
        <div class="pn">${esc(c.name)}</div>
        <div class="pv">${c.cpu.toFixed(1)}%</div>
        <div class="pv">${mb(c.memory_mb)}${c.limit_mb ? ' / ' + mb(c.limit_mb) : ''}</div>
      </div>`).join('');

  drawTemperature(s);

  $('stamp').textContent = new Date().toLocaleTimeString();
}

$('enable').addEventListener('click', async () => {
  const b = $('enable'), n = $('enable-note');
  b.disabled = true; b.textContent = 'Installing...';
  n.style.display = 'block'; n.className = '';
  n.textContent = 'Checking the installer signature. Windows will ask for permission.';
  try {
    n.textContent = await window.__TAURI__.core.invoke('enable_temperature');
    b.style.display = 'none';
  } catch (e) {
    n.className = 'bad';
    n.textContent = String(e);
    b.disabled = false; b.textContent = 'Try again';
  }
});

async function tick() {
  try { render(await invoke()); } catch (e) { console.error(e); }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
