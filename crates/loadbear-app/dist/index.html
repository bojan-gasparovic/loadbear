<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LoadBear</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #e3e6eb;
    --text: #16191e;
    --dim: #565d68;
    --faint: #848b96;
    --hair: #a8aeb8;
    --well: #eaedf1;

    /* Darkened from their dark mode values. The same green on white does not
       carry the same weight it did on near black, and these three are the only
       thing telling the user how the machine is doing. */
    --easy: #2e7d55;
    --braced: #96680f;
    --strained: #b13b2f;

    /* The graph, kept apart from the tier colours so a busy but healthy
       machine does not read as a warning. */
    --plot-fill: #dbe6f2;
    --plot-line: #4a7ba7;
  }
  * { box-sizing: border-box; }

  /* The window is a fixed size and does not resize, so the layout is a fixed
     grid rather than a scrolling column. Nothing here may scroll: every region
     that could outgrow its slot clips and says how much it left out, which is
     honest and keeps the panel readable at a glance rather than needing to be
     driven. */
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default;
  }
  body { display: flex; flex-direction: column; }
  #app {
    flex: 1 1 auto; min-height: 0; padding: 16px 18px 12px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 12px; overflow: hidden;
  }

  /* The window is undecorated and draws its own caption, because Windows will
     not let an application put a button of its own among the system caption
     buttons and the collapse control belongs beside minimise rather than loose
     in the page.

     28px against the 39 the system draws. In the full window that is nothing;
     on a 192px strip it is a seventh of the height back. */
  #titlebar { flex: none; height: 28px; display: grid;
              grid-template-columns: auto 1fr auto; align-items: center;
              background: var(--panel); border-bottom: 1px solid var(--line); }
  /* Same silhouette and the same tier colour as the large one, so the caption
     says how the machine is doing even when the window is behind something. */
  #tb-icon { width: 15px; height: 15px; margin-left: 10px;
             background-color: var(--faint);
             -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat;
             -webkit-mask-position: center; transition: background-color .3s ease; }
  #tb-title { font-size: 11px; color: var(--dim); padding-left: 8px; }
  #tb-buttons { display: flex; align-self: stretch; }
  #tb-buttons button { width: 40px; border: 0; padding: 0; margin: 0; cursor: pointer;
                       background: transparent; color: var(--dim);
                       font: inherit; font-size: 11px; line-height: 1;
                       display: flex; align-items: center; justify-content: center; }
  #tb-buttons button:hover { background: var(--well); color: var(--text); }
  /* A bar, beside two small triangles. It has to read as a strip lying along
     the bottom of the screen rather than as a third arrow, and at the size the
     triangles use it is a heavy black slab, so it comes down to meet them. */
  #tb-strip { font-size: 8px; }
  /* The one colour Windows uses for this and the one users read without
     thinking, so it is not worth being original about. */
  #tb-close:hover { background: #c42b1c; color: #ffffff; }

  /* Two halves matching `.cols` below, so the temperature row is exactly as
     wide as the graph underneath it and the tiles line up with its edges. */
  header { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: center; }
  .hleft { display: grid; grid-template-columns: 46px auto; align-items: center;
           gap: 13px; justify-content: start; }
  /* The artwork is a flat white silhouette with only its alpha carrying
     shape, so it is invisible on a light background as an image. Painted
     through a mask it takes the tier colour, which loses nothing and puts the
     state in the one element the eye lands on first. */
  #bear { width: 46px; height: 46px; background-color: var(--faint);
          -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat;
          -webkit-mask-position: center; transition: background-color .3s ease; }
  .title { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  #tier { font-size: 23px; font-weight: 620; letter-spacing: -.01em; line-height: 1.1; }
  #tier.easy { color: var(--easy); }
  #tier.braced { color: var(--braced); }
  #tier.strained { color: var(--strained); }


  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; overflow: hidden; min-height: 0; }
  /* Explicit rows rather than flow, so a section that is empty still holds its
     slot and nothing below it moves when it fills. */
  .col-left { display: grid; grid-template-rows: auto auto 1fr; gap: 10px;
              overflow: hidden; min-height: 0; }
  /* The findings slot is 142px rather than a round 132 because of what the
     remainder does to the panel underneath it. Running is a stack of 19.95px
     rows in a box that clips, so unless the box is close to a whole number of
     them the last row is sliced through its text and reads as a rendering
     fault. Ten pixels moved up here lands the remainder near zero, which
     costs nothing since findings had the room to spare. */
  .col-right { display: grid; grid-template-rows: 142px 1fr; gap: 10px;
               overflow: hidden; min-height: 0; }
  .col-left > *, .col-right > * { min-height: 0; overflow: hidden; }

  /* Things that belong together share a box. The border is the grouping. */
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: 9px 11px; display: flex;
           flex-direction: column; min-height: 0; overflow: hidden; }
  .panel > h2 { flex: none; }
  .panel .body { flex: 1 1 auto; min-height: 0; overflow: hidden; }

  #cpu { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  #brand { font-size: 12.5px; }
  #identity { font-size: 11px; color: var(--faint); margin-top: 2px; }

  .rows { display: grid; gap: 0; }
  .row { display: grid; grid-template-columns: 62px 1fr; gap: 10px;
         padding: 3px 0; align-items: baseline; }
  .k { color: var(--faint); font-size: 11px; }
  .v { font-variant-numeric: tabular-nums; font-size: 12px; }
  .v .sub { color: var(--dim); font-size: 10.5px; }

  /* Each stall carries the quantity it was actually measured from, because the
     percentage is a normalisation against a constant and the raw figure is the
     measurement. Where the constant is a poor fit for the hardware, and for
     disk latency it always is, the raw figure is the part worth reading. */
  .stalls { display: grid; gap: 7px; }
  .st { display: grid; grid-template-columns: 58px 1fr 30px; gap: 8px; align-items: center; }
  .st .sl { font-size: 10.5px; color: var(--faint); }
  .st .track { height: 5px; background: var(--well); border-radius: 3px; overflow: hidden; }
  .st .fill { height: 100%; width: 0%; background: var(--hair);
              transition: width .35s ease, background .35s ease; }
  .st.hot .fill { background: var(--braced); }
  .st.max .fill { background: var(--strained); }
  .st .sv { font-size: 10.5px; text-align: right; color: var(--dim);
            font-variant-numeric: tabular-nums; }
  .st .sr { grid-column: 2 / 4; font-size: 10px; color: var(--hair);
            font-variant-numeric: tabular-nums; margin-top: -4px; }

  h2 { font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--faint);
       margin: 0 0 6px; font-weight: 600; }
  h2 .hint { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--hair); }

  .graph { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  /* 24 rather than 40. The floor is here so the plot cannot vanish, but at 40
     it was higher than the space the left column actually leaves, so the plot
     refused to shrink and the caption below it was clipped through its
     descenders instead. "5 min ago" was rendering as "5 min aqo". */
  .graph svg { width: 100%; flex: 1 1 auto; min-height: 24px; display: block; }
  .graph .strip { display: flex; height: 4px; overflow: hidden; flex: none;
                  border-radius: 2px; margin-top: 3px; }
  .graph .strip i { flex: 1 1 0; }
  /* `flex: none` because the panel above this one can be squeezed shorter than
     its contents, and a flexible caption absorbs the squeeze by being sliced
     through its own text. The plot has a min-height and gives way first, which
     is the right order: a shorter graph still reads, half a word does not. */
  .graph .cap { flex: none; display: flex; justify-content: space-between;
                align-items: baseline;
                font-size: 10px; color: var(--hair); margin-top: 5px; }
  /* The legend colours the word rather than a swatch beside it. A single dash
     glyph at this size reads as grey whatever colour it is actually painted. */
  .graph .cap i { font-style: normal; font-weight: 650; margin-left: 11px; }
  .graph .cap i:first-child { margin-left: 0; }
  .graph .cap .k-busy { color: var(--plot-line); }
  .graph .cap .k-wait { color: var(--strained); }

  #verdicts { overflow: hidden; }
  #why { font-size: 11.5px; color: var(--dim); line-height: 1.4; margin-bottom: 2px; }
  .verdict { border-left: 2px solid var(--strained); background: var(--well);
             border-radius: 0 5px 5px 0; padding: 6px 9px; margin-top: 6px; }
  .verdict.degraded { border-left-color: var(--braced); }
  .verdict .vk { font-size: 11px; font-weight: 620; margin-bottom: 2px; }
  .verdict .vd { font-size: 11.5px; color: var(--text); }
  .verdict .vc { font-size: 11.5px; margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line); }
  .verdict .va { font-size: 10.5px; color: var(--dim); margin-top: 2px; }
  .verdict .vn { font-size: 10.5px; color: var(--faint); margin-top: 5px;
                 padding-top: 5px; border-top: 1px solid var(--line); font-style: italic; }
  .more { font-size: 10.5px; color: var(--faint); }

  .quiet { color: var(--faint); font-size: 11.5px; }

  .plist { height: 100%; overflow: hidden; }
  /* The memory column is fixed, so widening the window alone sends the extra
     space to the name and leaves a container's "341 MB / 7.5 GB" wrapping in
     the same cramped cell. It is sized for that longest form instead. */
  .plist .p { display: grid; grid-template-columns: 1fr 46px 96px; gap: 8px;
              font-size: 11px; padding: 2px 0; align-items: baseline; }
  .plist .p .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .p .pv { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums;
                  white-space: nowrap; }
  .plist .p.head { color: var(--hair); font-size: 9px; text-transform: uppercase; letter-spacing: .05em; }
  .plist .p.head .pv { color: var(--hair); }
  /* A container is drawn as a child of the Docker row above it, because that
     is exactly what it is: the thing Windows could see, opened up. */
  .plist .p.container .pn { padding-left: 13px; color: var(--dim); position: relative; }
  .plist .p.container .pn::before { content: "\21B3"; position: absolute; left: 1px; color: var(--hair); }

  /* Temperature lives in the header rather than in a panel of its own. Per
     core tiles and nothing else, in a single row: the package figure was the
     average of what these already say, so it cost a line to repeat them. */
  #temp { text-align: right; min-height: 34px; display: flex;
          flex-direction: column; justify-content: center; }
  /* Eight equal fractions of the half, so the row is the width of the graph
     below it whatever the window is. */
  #zones { display: none; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  #zones .z { background: var(--well); border: 1px solid transparent;
              border-radius: 5px; padding: 3px 2px; text-align: center; }
  #zones .zl { font-size: 7.5px; color: var(--faint); letter-spacing: .02em; line-height: 1.2;
               white-space: nowrap; }
  #zones .zv { font-size: 14px; font-weight: 560; font-variant-numeric: tabular-nums;
               line-height: 1.2; white-space: nowrap; }
  /* The unit rides small beside the number so the reading stays the thing the
     eye lands on. */
  #zones .zu { font-size: 8.5px; font-weight: 500; margin-left: 1px; opacity: .75; }

  /* Coloured by headroom below the vendor's published TjMax, never by an
     absolute scale. A band is chosen in `loadbear_core::thermal_band`, and a
     part that publishes no limit gets no colour rather than a guess. */
  #zones .z.normal  { background: #e4f1ea; border-color: #c6e2d3; }
  #zones .z.normal  .zv { color: var(--easy); }
  #zones .z.warm    { background: #fbf2d8; border-color: #ecdca6; }
  #zones .z.warm    .zv { color: #8a6c08; }
  #zones .z.hot     { background: #fdeadb; border-color: #f3cfb2; }
  #zones .z.hot     .zv { color: #b3560f; }
  #zones .z.atlimit { background: #fbe3e0; border-color: #efc4bf; }
  #zones .z.atlimit .zv { color: var(--strained); }
  #temp-note { font-size: 10.5px; color: var(--faint); line-height: 1.4; }
  #enable { margin-top: 6px; display: none; font: inherit; font-size: 10.5px; font-weight: 560;
            color: #ffffff; background: var(--text); border: 0; border-radius: 5px;
            padding: 4px 10px; cursor: pointer; }
  #enable:hover:not(:disabled) { background: #3a424e; }
  #enable:disabled { opacity: .5; cursor: default; }
  #enable-note { display: none; margin-top: 5px; font-size: 10px; color: var(--faint); }
  #enable-note.bad { color: var(--strained); }

  footer { font-size: 10px; color: var(--hair); display: flex;
           justify-content: space-between; align-items: baseline; gap: 12px; }
  footer .by { display: flex; gap: 12px; align-items: baseline; }
  /* Not real links. The webview would either refuse to load them or navigate
     the application away from itself, so they hand a fixed target to the
     shell instead. Styled as links because that is what they behave like. */
  footer a { color: var(--faint); cursor: pointer; text-decoration: none;
             border-bottom: 1px solid transparent; }
  footer a:hover { color: var(--plot-line); border-bottom-color: var(--plot-line); }

  /* The collapsed shape: a 900x124 strip meant to sit on top of other windows
     all day without covering them.

     It is the same three nodes the full window already has, moved into one row
     rather than drawn a second time. Everything else hides. Keeping one copy of
     each is what lets `render` go on finding `#chart` and `#zones` by id and
     stay unaware that either layout exists.

     The bear comes across without its words. At 56px, colour alone carries the
     tier, which is the one thing here that is an answer rather than evidence.

     Width is spent on the graph. Five minutes of history in 191px was a
     sparkline; the tiles fold to four across so the plot can have 538. */
  #compact { display: none; }
  body.collapsed header,
  body.collapsed .cols,
  body.collapsed footer { display: none; }
  body.collapsed #app { grid-template-rows: 1fr; }
  body.collapsed #compact { display: grid; grid-template-columns: 56px 1fr 228px;
                            gap: 10px; min-height: 0; overflow: hidden; }
  body.collapsed #compact > * { min-height: 0; }
  body.collapsed #bear { width: 56px; height: 56px; align-self: center; }

  /* Every margin in the strip is the smallest one that still separates two
     things, and vertically there is none at all. The full window can afford air
     because it is read; this is meant to be looked past. The tiles set the
     height of both panels by sitting flush against their own borders, and
     everything the trimming frees goes to the window being shorter.

     The graph loses its heading with them. The caption under the plot already
     reads "5 min ago" and "now", so the line above it was saying a third time
     what the axis says twice. */
  body.collapsed #app { padding: 8px 10px; }
  body.collapsed .panel { padding: 3px 8px; }
  body.collapsed #graph-panel > h2 { display: none; }
  body.collapsed .graph .cap { margin-top: 3px; }

  /* Both halves are panels, because one bordered box beside a set of loose
     tiles reads as an unfinished layout rather than as two sections. 234px is
     what holds four tiles at the width they have in the full window.

     No heading. Eight tiles reading "core #0" through "core #7" are not
     mistakable for anything else. The tiles are the shortest thing in the strip
     that cannot be made shorter, so they are what the whole window is measured
     from, down to the 3px above and below them. Flush against the border read
     as a mistake rather than as tight. */
  body.collapsed #temp { align-self: stretch; text-align: left;
                         background: var(--panel); border: 1px solid var(--line);
                         border-radius: 8px; padding: 3px 8px; }
  body.collapsed #zones { grid-template-columns: repeat(4, 1fr); }
  /* Set inline by `drawTemperature`, so overriding it takes the keyword. The
     button and its outcome are a full window conversation and there is no room
     for either in a strip. */
  body.collapsed #enable,
  body.collapsed #enable-note { display: none !important; }

  /* The taskbar shape: a 360x48 strip meant to be dragged on top of the
     Windows taskbar and left there.

     48 is measured, not chosen. A 1080 pixel display reports a 1032 pixel work
     area at 96 DPI, and Windows 11 22H2 removed the small taskbar setting, so
     it does not vary. The window already opens `alwaysOnTop`, which is the
     whole trick: nothing is embedded into the taskbar and no Win32 call is
     involved.

     Same three nodes again, moved rather than drawn a second time, so `render`
     still finds `#chart` and `#zones` by id and stays unaware that a third
     layout exists. */
  body.taskbar #titlebar { display: none; }
  body.taskbar header,
  body.taskbar .cols,
  body.taskbar footer { display: none; }
  body.taskbar #app { grid-template-rows: 1fr; padding: 2px 4px; }
  body.taskbar #compact { display: grid;
                          grid-template-columns: 28px 1fr 136px 16px;
                          gap: 6px; align-items: center;
                          min-height: 0; overflow: hidden; }
  body.taskbar #compact > * { min-height: 0; }
  body.taskbar #bear { width: 28px; height: 28px; align-self: center; }

  /* The graph gives up its box. A border around a 154px sparkline inside a
     48px strip is two frames drawn around the same thing, and the pixels the
     border and its padding cost are pixels the plot does not have. */
  body.taskbar #graph-panel { border: 0; background: transparent; padding: 0; }
  body.taskbar #graph-panel > h2,
  body.taskbar .graph .cap { display: none; }

  body.taskbar #temp { align-self: stretch; text-align: left;
                       background: transparent; border: 0; padding: 0; }
  body.taskbar #zones { grid-template-columns: repeat(4, 1fr); gap: 2px;
                        align-content: center; height: 100%; }
  body.taskbar #zones .z { padding: 1px 0; border-radius: 3px; }
  /* The label does not fit and comes off. A collapsed tile is about 34px, so
     two rows plus the gap is 72, larger than the whole taskbar. What is left
     holds a border, a pixel of padding and a 12px number, and nothing else.
     Four columns by two rows says which core each number is, which is what
     collapsed mode already relies on spatially.

     The degree symbol goes with it. Eight coloured numbers in a grid beside a
     bear are not mistakable for anything else, and the unit costs a third of
     the width of the number it follows. */
  body.taskbar #zones .zl,
  body.taskbar #zones .zu { display: none; }
  body.taskbar #zones .zv { font-size: 12px; line-height: 1.1; }

  /* Set inline by `drawTemperature`, so overriding it takes the keyword. */
  body.taskbar #enable,
  body.taskbar #enable-note,
  body.taskbar #temp-note { display: none !important; }

  /* The way out. The title bar is gone in this shape, and with it the chevron
     that would otherwise switch modes, so the strip has to carry its own. It
     is the only click target in it: everything else is a drag region. */
  #tb-restore { display: none; }
  body.taskbar #tb-restore { display: flex; align-items: center;
                             justify-content: center; align-self: stretch;
                             width: 16px; border: 0; padding: 0; margin: 0;
                             border-radius: 3px; cursor: pointer;
                             background: transparent; color: var(--faint);
                             font: inherit; font-size: 10px; line-height: 1; }
  body.taskbar #tb-restore:hover { background: var(--well); color: var(--text); }
</style>
</head>
<body>
<div id="titlebar" data-tauri-drag-region>
  <div id="tb-icon" role="img" aria-label="LoadBear"></div>
  <div id="tb-title" data-tauri-drag-region>LoadBear</div>
  <div id="tb-buttons">
    <!-- One button per shape, not one button cycling through them. A control
         whose meaning depends on which shape you are already in has to be
         clicked to find out what it does. -->
    <button id="tb-collapse" type="button" title="Collapse">&#9652;</button>
    <button id="tb-strip" type="button" title="Taskbar strip">&#9644;</button>
    <button id="tb-min" type="button" title="Minimise">&#8211;</button>
    <button id="tb-close" type="button" title="Close to tray">&#10005;</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="hleft">
      <div id="bear" role="img" aria-label="LoadBear"></div>
      <div>
        <div class="title">LoadBear</div>
        <div id="tier" class="easy">Easy</div>
      </div>
    </div>
    <div id="temp">
      <div id="zones"></div>
      <div id="temp-note"></div>
      <button id="enable">Enable temperature</button>
      <div id="enable-note"></div>
    </div>
  </header>

  <div class="cols">
    <div class="col-left">
      <div class="panel">
        <h2>Processor</h2>
        <div class="body">
          <div id="brand">Reading...</div>
          <div id="identity"></div>
          <div class="rows">
            <div class="row"><div class="k">Clock</div><div class="v" id="clock">-</div></div>
            <div class="row"><div class="k">Busy</div><div class="v" id="load">-</div></div>
            <div class="row"><div class="k">Power</div><div class="v" id="power">-</div></div>
            <div class="row"><div class="k">Memory</div><div class="v" id="memory">-</div></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Bottlenecks</h2>
        <div class="body">
          <div class="stalls">
            <div class="st" id="st-cpu">
              <div class="sl">processor</div>
              <div class="track"><div class="fill"></div></div>
              <div class="sv">0%</div>
              <div class="sr"></div>
            </div>
            <div class="st" id="st-mem">
              <div class="sl">memory</div>
              <div class="track"><div class="fill"></div></div>
              <div class="sv">0%</div>
              <div class="sr"></div>
            </div>
            <div class="st" id="st-disk">
              <div class="sl">disk</div>
              <div class="track"><div class="fill"></div></div>
              <div class="sv">0%</div>
              <div class="sr"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel" id="graph-panel">
        <h2>Last 5 minutes</h2>
        <div class="body graph">
          <svg id="chart" viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="strip" id="strip"></div>
          <div class="cap">
            <span>5 min ago</span>
            <span><i class="k-busy">busy</i><i class="k-wait">stall</i></span>
            <span>now</span>
          </div>
        </div>
      </div>
    </div>

    <div class="col-right">
      <div class="panel">
        <h2>Findings</h2>
        <div class="body">
          <div id="why"></div>
          <div id="verdicts"></div>
        </div>
      </div>

      <div class="panel">
        <h2 id="running-head">Running</h2>
        <div class="body">
          <div class="plist" id="running"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty until a strip is asked for. The three nodes that live here are
       borrowed from the layout above rather than copied.

       The drag attribute is added and removed by `setMode`, not written here.
       Only the taskbar shape drags from anywhere on itself; the collapsed one
       keeps its own title bar and drags from that, as it always did. -->
  <div id="compact">
    <button id="tb-restore" type="button" title="Expand">&#9652;</button>
  </div>

  <footer>
    <span id="stamp"></span>
    <span class="by">
      Bojan Gasparovic
      <a id="contact">bojan@zeroemdashes.com</a>
      <a id="repo">github.com/bojan-gasparovic/loadbear</a>
    </span>
  </footer>
</div>

<script>
const invoke = () => window.__TAURI__.core.invoke('get_status');
const $ = id => document.getElementById(id);

// Process and container names come from the filesystem and from Docker, so
// they are the one part of this status that LoadBear did not write itself.
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const mb = v => v >= 1024 ? (v / 1024).toFixed(1) + ' GB' : Math.round(v) + ' MB';

// One stall row: the normalised bar, and the quantity it was measured from.
//
// The percentage is a normalisation against a saturation constant, and two of
// the three constants are admittedly weak. The raw figure beside it is the
// actual measurement, so a bar sitting near zero can be read as "the disk is
// answering in half a millisecond" rather than as a broken indicator.
function stall(el, v, raw) {
  const pct = Math.round(v * 100);
  el.querySelector('.fill').style.width = Math.max(pct, v > 0 ? 1 : 0) + '%';
  el.querySelector('.sv').textContent = pct + '%';
  el.querySelector('.sr').textContent = raw;
  el.classList.toggle('hot', v >= 0.40 && v < 0.80);
  el.classList.toggle('max', v >= 0.80);
}

// Read from the stylesheet rather than repeated here, so the strip, the bear
// and the tier word can never disagree about what Braced looks like.
const css = getComputedStyle(document.documentElement);
const ink = name => css.getPropertyValue(name).trim();
const TIER_COLOR = [ink('--easy'), ink('--braced'), ink('--strained')];
const TIER_INDEX = { easy: 0, braced: 1, strained: 2 };

// Utilization as an area, the worst stall over it, and a strip underneath
// showing what the tier actually was at each tick.
//
// The point of the strip is the comparison. A spike in the line with no
// matching colour under it is LoadBear visibly declining to call a burst a
// problem, which has to be legible for the tier to be worth trusting.
function drawGraph(history) {
  const svg = $('chart'), strip = $('strip');
  if (!history || history.length < 2) {
    svg.innerHTML = `<text x="100" y="55" fill="${ink('--hair')}" font-size="9" text-anchor="middle">collecting</text>`;
    strip.innerHTML = '';
    return;
  }

  const n = history.length;
  const x = i => (i / (n - 1)) * 200;
  const y = v => 100 - Math.max(0, Math.min(1, v)) * 96 - 2;
  const line = key => history.map((h, i) => `${x(i).toFixed(2)},${y(key(h)).toFixed(2)}`).join(' ');

  const util = line(h => h.utilization / 100);
  const stall = line(h => Math.max(h.cpu, h.memory, h.io));

  svg.innerHTML =
    `<polygon points="0,100 ${util} 200,100" fill="${ink('--plot-fill')}" />` +
    `<polyline points="${util}" fill="none" stroke="${ink('--plot-line')}" stroke-width="1.5" vector-effect="non-scaling-stroke" />` +
    `<polyline points="${stall}" fill="none" stroke="${ink('--strained')}" stroke-width="1.5" vector-effect="non-scaling-stroke" />`;

  strip.innerHTML = history.map(h =>
    `<i style="background:${TIER_COLOR[h.tier] || TIER_COLOR[0]}"></i>`).join('');
}

// Nothing scrolls, so anything that will not fit is dropped and counted rather
// than pushed out of sight.
const VERDICT_SLOTS = 2;

// One row. More cores than this and the rest are left off rather than allowed
// to wrap and push the header taller, because the header is a fixed slot.
const CORE_TILES = 8;

// The contributor list is headed with the thing it is ranked by, rather than
// pointing vaguely at the panel above it.
// The list reorders itself to answer whichever question the rest of the window
// is asking, so it says which order it is in.
const RUNNING_HEAD = {
  cpu: 'Running · by processor',
  memory: 'Running · by memory',
  disk: 'Running · by memory',
};

// Tiles for cores and nothing else. The package figure is an average of what
// the tiles already show, so it took a line to repeat them.
//
// LoadBear never invents a normal range, so a tile is never coloured against
// one. Colour comes from headroom below the vendor's own TjMax, and when TjMax
// is unknown the tiles stay uncoloured rather than guessing.
function drawTemperature(s) {
  const zones = (s.temp_zones || []).filter(z => /^core/i.test(z.label));
  const z = $('zones'), note = $('temp-note'), en = $('enable');

  if (zones.length) {
    z.style.display = 'grid';
    note.textContent = '';
    z.innerHTML = zones.slice(0, CORE_TILES).map(zone => {
      const n = zone.label.replace(/^core\s*/i, '');
      // The band is decided in the engine against the published TjMax. An
      // absent band means the part publishes no limit, and the tile stays
      // uncoloured rather than being coloured against an invented range.
      return `<div class="z ${zone.band || ''}">`
        + `<div class="zl">core #${esc(n)}</div>`
        + `<div class="zv">${zone.celsius.toFixed(0)}<span class="zu">°C</span></div></div>`;
    }).join('');
  } else {
    z.style.display = 'none';
    // Per core readings are the point. Without them, say so briefly rather
    // than falling back to a single number pretending to be the same thing.
    note.textContent = s.temp_available
      ? 'No per core sensor.'
      : s.temp_reason;
  }

  en.style.display = s.temp_offerable ? 'inline-block' : 'none';
  if (!en.disabled) en.textContent = s.temp_available ? 'Update helper' : 'Enable temperature';
}

// Cores, threads and base clock come from the operating system, so they are
// there on every machine. Rated power is the one figure only the vendor
// publishes, so it is the only part that can be missing.
function identityText(s) {
  const parts = [];
  if (s.cores) parts.push(`${s.cores} cores`);
  if (s.threads) parts.push(`${s.threads} threads`);
  if (s.base_mhz) parts.push(`base ${s.base_mhz} MHz`);
  if (s.tdp_watts) parts.push(`${s.tdp_watts} W rated`);
  return parts.join(' · ');
}

function clockText(s) {
  if (!s.mhz) return 'unavailable';
  if (!s.base_mhz) return `${s.mhz} MHz`;
  const d = s.mhz - s.base_mhz;
  if (d >= 0) {
    return `${s.mhz} MHz <span class="sub">${d} above the ${s.base_mhz} promised</span>`;
  }
  return `${s.mhz} MHz <span class="sub">${-d} below the ${s.base_mhz} promised</span>`;
}

function render(s) {
  const tier = s.tier.toLowerCase();
  $('tier').textContent = s.tier;
  $('tier').className = tier;
  // Both bears, so the caption carries the tier when the window is behind
  // something and in the strip, where the word does not come along.
  const mask = `url('bear-${tier}-128.png')`;
  const paint = TIER_COLOR[TIER_INDEX[tier] ?? 0];
  for (const b of [$('bear'), $('tb-icon')]) {
    b.style.webkitMaskImage = mask;
    b.style.backgroundColor = paint;
  }
  // Empty when a finding card below already says it, so the panel does not
  // state the same thing twice.
  const why = $('why');
  why.textContent = s.reason;
  why.style.display = s.reason ? 'block' : 'none';

  $('brand').textContent = s.brand || 'Unknown processor';
  $('identity').textContent = identityText(s);

  // "3227 MHz sustained, base 2000" left the reader to work out which way is
  // good. The thing worth knowing is whether the processor is keeping the
  // manufacturer's promise, so say that instead of printing both numbers.
  $('clock').innerHTML = clockText(s);
  $('load').innerHTML = `${s.utilization.toFixed(0)}% <span class="sub">of ${s.logical} processors</span>`;
  // The figure that explains a machine running below its promised speed, so
  // it is shown next to the clock rather than only used inside a finding.
  // The rated figure is the vendor's and is genuinely unknown on a processor
  // the database has never seen. Printing "of 0 W rated" there was worse than
  // printing nothing.
  $('power').innerHTML = s.watts === null || s.watts === undefined
    ? '<span class="sub">needs the helper</span>'
    : s.tdp_watts
      ? `${s.watts.toFixed(1)} W <span class="sub">of ${s.tdp_watts} W rated</span>`
      : `${s.watts.toFixed(1)} W`;
  $('memory').innerHTML = s.total_mb > 0
    ? `${mb(s.available_mb)} free <span class="sub">of ${mb(s.total_mb)}</span>`
    : `${mb(s.available_mb)} free`;

  stall($('st-cpu'), s.stall_cpu, `${s.queue.toFixed(1)} queued`);
  stall($('st-mem'), s.stall_memory, `${Math.round(s.hard_faults)} fetches/sec`);
  stall($('st-disk'), s.stall_io, `${s.disk_ms.toFixed(2)} ms`);

  // Busy and waiting are different things, and the whole product rests on the
  // difference. Saying so once beats letting three flat bars read as broken.

  drawGraph(s.history);

  const v = $('verdicts');
  if (!s.verdicts.length) {
    v.innerHTML = '';
  } else {
    const shown = s.verdicts.slice(0, VERDICT_SLOTS);
    const hidden = s.verdicts.length - shown.length;
    v.innerHTML = shown.map(x => `
      <div class="verdict ${x.severity === 'Degraded' ? 'degraded' : ''}">
        <div class="vk">${x.kind}</div>
        <div class="vd">${x.detail}</div>
        ${x.cause
          ? `<div class="vc">Caused by <b>${esc(x.cause)}</b></div>
             ${x.action ? `<div class="va">${esc(x.action)}</div>` : ''}`
          : `<div class="vn">No clear cause.</div>`}
      </div>`).join('')
      + (hidden > 0 ? `<div class="more">and ${hidden} more</div>` : '');
  }

  $('running-head').textContent = RUNNING_HEAD[s.driver] || 'Running';
  $('running').innerHTML =
    '<div class="p head"><div class="pn">application</div><div class="pv">cpu</div><div class="pv">memory</div></div>'
    + s.running.map(c => `
      <div class="p${c.is_container ? ' container' : ''}">
        <div class="pn">${esc(c.name)}</div>
        <div class="pv">${c.cpu.toFixed(1)}%</div>
        <div class="pv">${mb(c.memory_mb)}${c.limit_mb ? ' / ' + mb(c.limit_mb) : ''}</div>
      </div>`).join('');

  drawTemperature(s);

  // Explicit 24 hour, rather than whatever the locale prefers. A monitor is
  // read at a glance and AM/PM is two characters of nothing.
  $('stamp').textContent = new Date().toLocaleTimeString([], {
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  });
}

// Switching shape moves three nodes and resizes the window. It does not draw a
// second interface, which is the point: there is one graph and one set of tiles
// in this document, and `render` above keeps finding them by id wherever they
// currently sit.
//
// The layout changes before the window does, so the frame in between shows the
// strip in a tall window rather than the full layout in a 192px one.
//
// Three shapes, named rather than counted, because the shell refuses a name it
// does not know and a number would resize to whatever it happened to mean.
let mode = 'expanded';

async function setMode(next) {
  const bear = $('bear');
  const graph = $('graph-panel');
  const temp = $('temp');

  if (next !== 'expanded') {
    // Before `#tb-restore`, which is the last column of the taskbar grid and
    // is hidden in every other shape. Appending would put the way out first.
    $('compact').prepend(bear, graph, temp);
  } else {
    // Back where each came from. The bear is the first thing in `.hleft` and
    // the other two are the last in theirs, so this restores the original
    // order rather than merely the original parent.
    document.querySelector('.hleft').prepend(bear);
    document.querySelector('header').append(temp);
    document.querySelector('.col-left').append(graph);
  }

  document.body.classList.toggle('collapsed', next === 'collapsed');
  document.body.classList.toggle('taskbar', next === 'taskbar');

  // Read from the Tauri 2.11.5 source on 2026-08-16
  // (`tauri/src/window/scripts/drag.js`): `isDragRegion` walks the composed
  // path upward from the event target, and "deep" makes the whole subtree a
  // drag region while a bare attribute matches only a direct click on the
  // element itself. So one attribute on `#compact` is enough and no
  // transparent overlay is needed.
  //
  // The same walk stops at a clickable element carrying no attribute of its
  // own, which is what leaves `#tb-restore` clickable inside a strip that
  // otherwise drags from anywhere.
  //
  // Only the taskbar shape gets it. Collapsed still has its title bar to drag
  // from, and giving it this would be a change to a mode nobody asked to
  // change.
  if (next === 'taskbar') {
    $('compact').setAttribute('data-tauri-drag-region', 'deep');
  } else {
    $('compact').removeAttribute('data-tauri-drag-region');
  }

  // The chevron is the only one of the three that has two states, because it
  // is the only one that is a toggle. Down means it will give the window back.
  $('tb-collapse').innerHTML = next === 'collapsed' ? '&#9662;' : '&#9652;';
  $('tb-collapse').title = next === 'collapsed' ? 'Expand' : 'Collapse';
  mode = next;

  try {
    await window.__TAURI__.core.invoke('set_mode', { mode: next });
  } catch (e) {
    console.error(e);
  }
}

// One control per shape rather than one control cycling through them. A button
// whose meaning depends on the shape you are already in has to be clicked to
// find out what it does, and there is no way to look at it and know.
//
// Neither of these is reachable from the taskbar strip, which hides the title
// bar they live in. `#tb-restore` is the way out of that one.
$('tb-collapse').addEventListener('click', () => {
  setMode(mode === 'collapsed' ? 'expanded' : 'collapsed');
});
$('tb-strip').addEventListener('click', () => setMode('taskbar'));

// Straight back to the full window. Someone clicking their way out of a 48px
// strip wants out of it, not one step along a cycle.
$('tb-restore').addEventListener('click', () => setMode('expanded'));

// With no system chrome there is nothing else to minimise or dismiss the
// window, so these two are not conveniences.
$('tb-min').addEventListener('click', () => {
  window.__TAURI__.core.invoke('minimize_window').catch(e => console.error(e));
});
$('tb-close').addEventListener('click', () => {
  window.__TAURI__.core.invoke('hide_window').catch(e => console.error(e));
});

$('enable').addEventListener('click', async () => {
  const b = $('enable'), n = $('enable-note');
  b.disabled = true; b.textContent = 'Installing...';
  n.style.display = 'block'; n.className = '';
  n.textContent = 'Checking the installer signature. Windows will ask for permission.';
  try {
    n.textContent = await window.__TAURI__.core.invoke('enable_temperature');
    b.style.display = 'none';
  } catch (e) {
    n.className = 'bad';
    n.textContent = String(e);
    b.disabled = false; b.textContent = 'Try again';
  }
});

$('repo').addEventListener('click', () => {
  window.__TAURI__.core.invoke('open_repository').catch(e => console.error(e));
});
$('contact').addEventListener('click', () => {
  window.__TAURI__.core.invoke('open_contact').catch(e => console.error(e));
});

async function tick() {
  try { render(await invoke()); } catch (e) { console.error(e); }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
